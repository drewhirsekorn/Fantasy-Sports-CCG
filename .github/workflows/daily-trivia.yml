# The 7am Eastern job.
#
# GitHub's scheduler is UTC and does not know about daylight saving, so this
# fires twice -- 11:00 and 12:00 UTC -- and lets the build decide which one is
# actually 07:00 in New York. The other run finds the day already published
# and exits without touching a file. See trivia/build.py:live_day.
name: daily trivia

on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 ET while daylight saving is in effect
    - cron: "0 12 * * *"   # 07:00 ET while it is not
  workflow_dispatch:
    inputs:
      force:
        description: "rebuild today even if it is already published"
        type: boolean
        default: false

concurrency:
  group: daily-trivia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The rules that decide whether a question is honest are the ones worth
      # running before publishing, not after.
      - name: test
        run: python3 -m trivia.test_trivia

      - name: build today's puzzle
        run: |
          python3 -m trivia.build ${{ inputs.force && '--force' || '' }}

      - name: commit
        run: |
          if git diff --quiet -- data/trivia_ledger.json web/trivia_data.json web/trivia.html; then
            echo "nothing changed; today was already published."
            exit 0
          fi
          git config user.name  "daily-trivia"
          git config user.email "daily-trivia@users.noreply.github.com"
          git add data/trivia_ledger.json web/trivia_data.json web/trivia.html
          git commit -m "Trivia for $(date -u +%Y-%m-%d)"
          # The ledger is append-only and the page is a build of it, so a
          # rebase onto whatever landed while this ran is always safe.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
